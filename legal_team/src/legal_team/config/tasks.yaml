extract_contract_data_task:
  description: >
    Read and process the raw text of the provided freelance computer science contract. 
    Systematically identify and extract all key entities (parties involved, agreement dates, effective dates) and structurally isolate critical clauses. 
    You must specifically focus on extracting text related to Intellectual Property (IP) Ownership, Non-Compete agreements, Exclusivity, Non-Solicitation, Cap on Liability, and payment or milestone terms. 
    Do not analyze or judge the text; simply extract it accurately verbatim.
  expected_output: >
    A highly structured dictionary or JSON object containing the extracted contract data. 
    It must categorize the raw text of each found clause under clear keys (e.g., 'IP_Ownership_Clause', 'Non_Compete_Clause', 'Payment_Terms') and explicitly list the contracting parties and relevant dates. If a specific clause type is not found in the text, mark its value as 'Not Present'.
  agent: extractor_agent

analyze_contract_risks_task:
  description: >
    Review the structured contract data and clauses provided by the Extractor Agent. 
    Evaluate these clauses specifically from the perspective of a freelance computer science professional. 
    Identify and flag any potential red flags, ambiguous language, scope creep, or unbalanced obligations. 
    Pay special attention to predatory data privacy liabilities, vague milestone-based payment terms, unreasonable non-competes, and unfair Intellectual Property (IP) transfers.
    Do not conduct external research; rely on your internal expertise to highlight which clauses look suspicious or unfavorable.
  expected_output: >
    A structured preliminary risk assessment report. For every red flag or unbalanced clause found, list the original clause name, the exact text in question, and a brief explanation of why it is potentially risky or unfair to a tech freelancer. 
  agent: analyst_agent

research_legal_precedents_task:
  description: >
    Take the preliminary risk assessment report generated by the Analyst Agent. 
    For every red flag or unbalanced clause identified, query the external Pinecone vector database to retrieve the corresponding "fair" baseline clauses and standard tech-industry precedents. 
    Compare the exact wording of the flagged contract clause against the verified fair precedents retrieved from the database. 
    Determine factually if the Analyst's concerns are valid or if they are a false alarm (AI hallucination). 
    Do not offer final negotiation advice; focus strictly on evidence-based verification.
  expected_output: >
    A verified factual research report. For each originally flagged risk, this report must include: the original flagged text, the verified "fair" baseline text retrieved from the Pinecone database, and a strict, factual determination of whether the clause deviates significantly from the fair industry standard.
  agent: researcher_agent

generate_final_report_task:
  description: >
    Review the verified factual research report provided by the Researcher Agent. 
    Synthesize these findings to create a comprehensive, plain-English risk assessment tailored for a freelance computer science professional (e.g., software engineer, UI/UX designer). 
    Translate all dense legal jargon into easily understandable concepts. 
    You must evaluate the severity of the verified red flags to determine the overall safety of the agreement. 
    Finally, formulate specific, practical negotiation points the freelancer can use to push back against the unfair clauses.
  expected_output: >
    A final, structured Contract Risk Report containing three distinct sections:
    1. Overall Favorability Assessment: A clear statement on whether the contract is safe to sign, risky, or highly unfavorable.
    2. Plain-English Risk Summary: A breakdown of the verified red flags, explaining exactly what the freelancer stands to lose (e.g., IP rights, unpaid milestones) without using complex legal terminology.
    3. Actionable Negotiation Points: A bulleted list of specific counter-offers or wording changes the freelancer should request from the client to make the contract fair.
  agent: critic_explainer_agent