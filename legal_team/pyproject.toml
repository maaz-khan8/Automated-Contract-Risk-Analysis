[project]
name = "legal_team"
version = "0.1.0"
description = "legal_team using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[litellm,tools]==1.14.2",
]

[project.scripts]
legal_team = "legal_team.main:run"
run_crew = "legal_team.main:run"
train = "legal_team.main:train"
replay = "legal_team.main:replay"
test = "legal_team.main:test"
run_with_trigger = "legal_team.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
